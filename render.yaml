# Render blueprint: one free web service running the Docker image.
#   Render dashboard -> New -> Blueprint -> pick this repository.
# The first build downloads OpenStreetMap Kerala (with retries and size checks) and builds the map
# database (about 5-10 minutes); later deploys reuse cached layers. If the builder is too
# small, add a GEO_DB_URL environment variable (see docs/DEPLOYMENT.md): the image then
# downloads a prebuilt database instead of building one.
services:
  - type: web
    name: lumapath
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: INFO
